name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /tmp/deploy_key
          script: bash /var/www/skillhub/deploy.sh
